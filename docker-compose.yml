name: bomcurriculo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atsdatabase}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bomcurriculo

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.3}
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - bomcurriculo

  ollama-model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.3}
    restart: "no"
    environment:
      OLLAMA_HOST: ${OLLAMA_BASE_URL:-http://ollama:11434}
    command:
      - pull
      - "${OLLAMA_MODEL:-qwen3:4b}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - bomcurriculo

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment:
      BOT_URL: ${BOT_URL:-http://bot:8000}
      BOT_CONNECT_TIMEOUT_SECONDS: ${BOT_CONNECT_TIMEOUT_SECONDS:-5}
      BOT_HEALTH_TIMEOUT_SECONDS: ${BOT_HEALTH_TIMEOUT_SECONDS:-5}
      BOT_TIMEOUT_SECONDS: ${BOT_TIMEOUT_SECONDS:-260}
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:9000/up
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - bomcurriculo

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_REASONING: ${OLLAMA_REASONING:-false}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-2048}
      BOT_INFERENCE_DEADLINE_SECONDS: ${BOT_INFERENCE_DEADLINE_SECONDS:-240}
    ports:
      - "${BOT_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    networks:
      - bomcurriculo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL_CONNECT: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
      bot:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bomcurriculo

networks:
  bomcurriculo:
    driver: bridge

volumes:
  postgres_data:
  backend_storage:
  ollama_data:
