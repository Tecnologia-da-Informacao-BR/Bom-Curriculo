[project]
name = "bot"
version = "0.1.0"
description = "Bot base for ATS automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dependency-injector==4.49.1",
    "httpx==0.28.1",
    "hypercorn==0.18.0",
    "langchain==1.3.16",
    "langchain-deepseek==1.1.0",
    "langchain-google-genai==4.3.5",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.6.0",
    "markitdown[docx,pdf]==0.1.7",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "python-json-logger==4.2.0",
    "pyyaml==6.0.3",
    "quart==0.22.0",
    "quart-schema==0.24.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
